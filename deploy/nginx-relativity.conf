# WAI Gramophone — an isolated static deploy of https://waiwai.is/relativity
#
# The app used to be served out of another product's Next.js public/ tree, where
# it was tracked in that product's git; it could therefore only ship when that
# product shipped, and any checkout there restored an old build. That is how a
# bundle from months ago stayed live through five rounds of visual work.
#
# It now lives in its own tree, included by ONE line in the waiwai.is server
# block. Nothing else on this box is touched.
#
#   /var/www/relativity/releases/<sha>-<utc>/   one immutable directory per release
#   /var/www/relativity/current -> releases/...  the live one
#
# Rollback is a symlink, and needs NO nginx reload — open_file_cache is off on
# this box, so the path is resolved per request (measured, not assumed):
#   ln -sfn <older release> /var/www/relativity/.t \
#     && mv -Tf /var/www/relativity/.t /var/www/relativity/current
#
# Installed once, by hand:
#   scp deploy/nginx-relativity.conf wai-web-prod:/etc/nginx/snippets/relativity.conf
#   # then ONE line inside the waiwai.is server block of conf.d/wai-origin.conf:
#   #   include /etc/nginx/snippets/relativity.conf;
#   nginx -t && systemctl reload nginx
# Back up conf.d/wai-origin.conf to /root/nginx-backups, NEVER beside it: the
# include glob is conf.d/*.conf, and a backup that ever gains a .conf suffix
# gives waiwai.is a duplicate server block that `nginx -t` happily accepts.
#
# `systemctl reload nginx` exits 0 even when the master rejects the new config,
# so after any reload check: journalctl -u nginx --since '1 min ago' | grep -i emerg
#
# NOTE ON add_header: it REPLACES the inherited set rather than adding to it, so
# the three server-level security headers are restated in every block below.

# The canonical URL has no trailing slash — every share link ever issued is of
# the form /relativity?s=<id>, and the app it replaced answered exactly there.
# Serve it directly rather than redirecting: a redirect would both change the
# canonical form and add a hop to the hot path.
location = /relativity {
    # TLS terminates at the edge and this origin listens on :8080, so any absolute
    # Location nginx builds itself would carry http:// and :8080 and be unroutable
    # from the internet. Measured: a request for /relativity/assets emitted
    # Location: http://waiwai.is:8080/relativity/assets/.
    absolute_redirect off;
    root /var/www/relativity/current;
    try_files /index.html =404;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # index.html names the hashed assets, so it may never be held anywhere.
    # A cached index is precisely how the stale bundle survived.
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Content-hashed filenames, so they can be held forever. nginx takes the longest
# matching prefix, so this wins over the block below for anything under assets/.
location ^~ /relativity/assets/ {
    # TLS terminates at the edge and this origin listens on :8080, so any absolute
    # Location nginx builds itself would carry http:// and :8080 and be unroutable
    # from the internet. Measured: a request for /relativity/assets emitted
    # Location: http://waiwai.is:8080/relativity/assets/.
    absolute_redirect off;
    alias /var/www/relativity/current/assets/;
    try_files $uri =404;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ^~ /relativity/ {
    # TLS terminates at the edge and this origin listens on :8080, so any absolute
    # Location nginx builds itself would carry http:// and :8080 and be unroutable
    # from the internet. Measured: a request for /relativity/assets emitted
    # Location: http://waiwai.is:8080/relativity/assets/.
    absolute_redirect off;
    alias /var/www/relativity/current/;
    try_files $uri $uri/ /relativity/index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
